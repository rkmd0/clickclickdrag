<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leaf-let me alone!</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <div class="dashboard">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>draw your cool stuff!</h2>
            </div>
            
            <div id="feature-count">Features in database: <span id="count">0</span></div>
            
            <div class="basemap-section">
                <h3>Base Maps</h3>
                <select id="baseMapSelect">
                    <option value="osm">OpenStreetMap</option>
                    <option value="satellite">satellite</option>
                </select>
            </div>

            <div class="drawing-section">
                <h3>database options</h3>
                <div class="button-container">
                    <button onclick="saveToDatabase()">save to database</button>
                    <button onclick="loadFromDatabase()">load from database</button>
                </div>
            </div>

            <div class="export-section">
                <h3>more options</h3>
                <button onclick="exportGeoJSON()">export geoJSON</button>
                <button onclick="clearMap()">clear map</button>
            </div>
        </div>
        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="script.js"></script>
</body>
</html>
